name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: python-http-service
  TERRAFORM_WORKING_DIRECTORY: Terraform/environments/dev

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax check
        run: python -m py_compile server.py

      - name: Build Docker image
        run: docker build -t ${{ env.ECR_REPOSITORY }}:ci .

      - name: Dockerfile quality check
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: Terraform
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform plan -input=false

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform apply -auto-approve -input=false

      - name: Force ECS deployment for latest image
        run: |
          aws ecs update-service \
            --cluster Python-HTTP-service-cluster \
            --service Python-HTTP-service \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster Python-HTTP-service-cluster \
            --services Python-HTTP-service

      - name: Health check
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: |
          ALB_DNS_NAME=$(terraform output -raw alb_dns_name)

          for attempt in {1..12}; do
            if curl --fail --silent --show-error "http://$ALB_DNS_NAME/health"; then
              exit 0
            fi
            sleep 10
          done

          echo "Deployment did not become healthy. Check ECS service events, target group health, and CloudWatch logs."
          exit 1
