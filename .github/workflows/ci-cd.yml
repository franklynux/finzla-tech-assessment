name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: python-http-service
  TERRAFORM_WORKING_DIRECTORY: Terraform/environments/dev

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax check
        run: python -m py_compile server.py

      - name: Build Docker image
        run: docker build -t ${{ env.ECR_REPOSITORY }}:ci .

      - name: Dockerfile quality check
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: Terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform validate

  production_approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Approved
        run: echo "Production deployment approved."

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: production_approval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show OIDC claims
        run: |
          TOKEN_JSON=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')
          export TOKEN
          python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          keys = [
              "sub",
              "aud",
              "ref",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "workflow",
              "job_workflow_ref",
              "environment",
          ]

          print(json.dumps({key: claims.get(key) for key in keys}, indent=2))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform plan -input=false

      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: terraform apply -auto-approve -input=false

      - name: Force ECS deployment for latest image
        run: |
          aws ecs update-service \
            --cluster Python-HTTP-service-cluster \
            --service Python-HTTP-service \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster Python-HTTP-service-cluster \
            --services Python-HTTP-service

      - name: Health check
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        run: |
          ALB_DNS_NAME=$(terraform output -raw alb_dns_name)

          for attempt in {1..12}; do
            if curl --fail --silent --show-error "http://$ALB_DNS_NAME/health"; then
              exit 0
            fi
            sleep 10
          done

          echo "Deployment did not become healthy. Check ECS service events, target group health, and CloudWatch logs."
          exit 1
